name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The pull request was green against its own head. These run against the
      # merged tree, which is what actually ships.
      - name: Syntax-check every JS file
        run: |
          shopt -s globstar nullglob
          files=(**/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error title=No JS::Expected JavaScript sources on main."
            exit 1
          fi
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Run tests against the merged tree
        run: |
          shopt -s globstar nullglob
          tests=(tests/**/*.test.js)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error title=No tests::tests/ has no *.test.js files. The gate would be fake."
            exit 1
          fi
          echo "found ${#tests[@]} test file(s)"
          node --test 'tests/**/*.test.js'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
