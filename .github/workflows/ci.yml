name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check every JS file
        run: |
          shopt -s globstar nullglob
          files=(**/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice title=No JS yet::Repo not scaffolded; skipping syntax check."
          else
            for f in "${files[@]}"; do
              echo "checking $f"
              node --check "$f"
            done
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            node --test tests/
          else
            echo "::notice title=No tests yet::tests/ does not exist; skipping."
          fi
